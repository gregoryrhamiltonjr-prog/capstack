name: Capstack checks

on:
  pull_request:
  push:
    branches: [main, "otto/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies and generate Prisma client
        run: npm ci --include=dev
      - name: Regression tests, type check, production build
        run: npm run check
      - name: Responsive layout geometry (isolated synthetic fixtures)
        run: npm run test:layout
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - name: Known dependency vulnerabilities
        run: npm audit --include=dev --audit-level=moderate
